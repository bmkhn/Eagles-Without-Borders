name: Laravel Post-Deployment

on:
  push:
    branches:
      - main

concurrency:
  group: post-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Run Laravel deployment commands
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/u247912231/domains/eagleswithoutborders.com/public_html

            # The hosting provider pulls the new code from GitHub asynchronously,
            # while this workflow fires almost immediately after the push. Give the
            # deploy a moment to settle and retry transient failures instead of
            # failing the whole run (e.g. artisan hitting files mid-sync).
            sleep 15

            # Recreate the public/storage symlink that the deploy sync can remove.
            # PHP's symlink()/exec() are disabled on this host, so `storage:link`
            # can never work there -- create the link with `ln` via SSH instead.
            # If it can't be created, the /storage fallback route still serves files.
            if [ ! -L public/storage ] && [ ! -e public/storage ]; then
              ln -s ../storage/app/public public/storage
            elif [ -L public/storage ] && [ ! -d public/storage ]; then
              rm -f public/storage
              ln -s ../storage/app/public public/storage
            fi

            attempt=1
            while [ $attempt -le 3 ]; do
              echo "Post-deployment attempt $attempt of 3..."
              if php artisan migrate --force && php artisan optimize; then
                echo "Post-deployment commands completed successfully."
                exit 0
              fi
              echo "Attempt $attempt failed, retrying in 20s..."
              sleep 20
              attempt=$((attempt + 1))
            done

            echo "All 3 attempts failed." >&2
            exit 1
